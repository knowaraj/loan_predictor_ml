{% extends 'predictions/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'predictions/react/loan-form.css' %}">

<div
    id="react-loan-form"
    data-csrf="{{ csrf_token }}"
    data-action="{% url 'predict' %}">
</div>

{% if form.errors %}
<div class="row justify-content-center mt-3">
    <div class="col-md-10">
        <div class="alert alert-danger">
            <strong>Please fix the following errors:</strong>
            <ul class="mb-0 mt-2">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <li>{{ field|title }}: {{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endif %}

<script type="module" src="{% static 'predictions/react/loan-form.js' %}"></script>
<br>
{% endblock %}
