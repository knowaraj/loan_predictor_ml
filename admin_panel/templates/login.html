{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Loan System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --brand: #0f766e;
            --brand-dark: #115e59;
            --accent: #d97706;
            --surface: #ffffff;
            --bg-soft: #f6f9f8;
            --border: rgba(15, 23, 42, 0.10);
            --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
            --shadow-soft: 0 10px 24px rgba(15, 23, 42, 0.05);
        }

        * {
            font-family: 'Manrope', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            color: var(--ink);
            font-size: 16px;
            line-height: 1.65;
            font-weight: 400;
            background:
                radial-gradient(circle at 10% 0%, rgba(15, 118, 110, 0.12) 0, transparent 30%),
                radial-gradient(circle at 92% 8%, rgba(217, 119, 6, 0.10) 0, transparent 26%),
                linear-gradient(180deg, #f8fbfa 0%, #edf3f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            max-width: 420px;
            width: 100%;
            margin: 2rem;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 24px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.45s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .form-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .form-error {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px;
            padding: 0.875rem;
            margin-bottom: 1.25rem;
            color: #991b1b;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-control {
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-family: 'Manrope', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            color: var(--ink);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--brand);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: var(--muted);
        }

        .field-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.35rem;
            display: block;
        }

        .form-links {
            display: flex;
            margin-bottom: 1.75rem;
            font-size: 0.9rem;
        }

        .form-links a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-links a:hover {
            color: var(--brand-dark);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem 1.25rem;
            background: linear-gradient(120deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(15, 118, 110, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(15, 118, 110, 0.28);
            background: linear-gradient(120deg, var(--brand-dark) 0%, #0a4f4a 100%);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-footer a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: var(--brand-dark);
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Admin Access</h2>
    <p class="form-subtitle">Sign in to manage the system</p>

    {% if messages %}
        {% for message in messages %}
            <div class="form-error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" id="id_username" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" id="id_password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="form-links">
            <a href="{% url 'admin_reset_password' %}">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="form-footer">
        <a href="{% url 'home' %}">Back to home</a>
    </div>
</div>
</body>
</html>
